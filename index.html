<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira de Finanças Pessoais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <i class="fa-solid fa-wallet"></i>
        <div>
            <h1>Carteira</h1>
            <p>Finanças Pessoais</p>
        </div>
    </header>

    <main>


        <section id="resumo">
            <div class="cartao">
                <i class="fa-solid fa-coins icone"></i>
                <p>Saldo total</p>
                <span id="saldo">0,00 €</span>
            </div>
            <div class="cartao">
                <i class="fa-solid fa-arrow-up icone"></i>
                <p>Receitas</p>
                <span id="receitas">0,00 €</span>
            </div>
            <div class="cartao">
                <i class="fa-solid fa-arrow-down icone"></i>
                <p>Despesas</p>
                <span id="despesas">0,00 €</span>
            </div>
        </section>


        <div class="layout-principal">

            <section id="novo-movimento">
                <h2>Novo movimento</h2>

                <form id="form-movimento" novalidate>
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" maxlength="50" placeholder="Ex: Compras supermercado" required>

                    <label for="valor">Valor (€)</label>
                    <input type="text" id="valor" inputmode="decimal" placeholder="0,00" required>

                    <label for="tipo">Tipo</label>
                    <select id="tipo">
                        <option value="despesa">Despesa</option>
                        <option value="receita">Receita</option>
                    </select>

                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="Alimentação">Alimentação</option>
                        <option value="Habitação">Habitação</option>
                        <option value="Transportes">Transportes</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Trabalho">Trabalho</option>
                        <option value="Outros">Outros</option>
                    </select>

                    <label for="data">Data</label>
                    <input type="date" id="data" required>

                    <p id="erro-form" class="erro" hidden></p>

                    <button type="submit" id="add-mov">+ Adicionar</button>
                    <p id="sucesso-form" class="sucesso" hidden></p>
                </form>
            </section>


            <section id="movimentos">
                <h2>Movimentos</h2>

                <div id="filtros">
                    <div class="campos-filtros">

                        <div class="campo campo-pesquisa">
                            <label for="pesquisa">Pesquisar</label>
                            <input type="search" id="pesquisa" placeholder="Pesquisar...">
                        </div>

                        <div class="campo">
                            <label for="filtro-tipo">Tipo</label>
                            <select id="filtro-tipo">
                                <option value="todos">Todos</option>
                                <option value="receita">Receitas</option>
                                <option value="despesa">Despesas</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="filtro-categoria">Categoria</label>
                            <select id="filtro-categoria">
                                <option value="">Todas</option>
                                <option value="Alimentação">Alimentação</option>
                                <option value="Habitação">Habitação</option>
                                <option value="Transportes">Transportes</option>
                                <option value="Lazer">Lazer</option>
                                <option value="Saúde">Saúde</option>
                                <option value="Trabalho">Trabalho</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="filtro-ordem">Ordenar por</label>
                            <select id="filtro-ordem">
                                <option value="recentes">Mais recentes</option>
                                <option value="antigos">Mais antigos</option>
                                <option value="valor">Maior valor</option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="cabecalho-movimentos">
                    <span>Descrição</span>
                    <span>Categoria</span>
                    <span>Data</span>
                    <span>Valor</span>
                    <span></span>
                </div>

                <ul id="lista-movimentos"></ul>
            </section>

        </div>

        <section id="despesas-categoria">
            <h2>Despesas por categoria</h2>
            <ul id="lista-categorias"></ul>
        </section>

    </main>


    <dialog id="modal-apagar">
        <h3>Apagar movimento?</h3>
        <p id="modal-texto"></p>
        <div class="modal-botoes">
            <button type="button" id="modal-cancelar">Cancelar</button>
            <button type="button" id="modal-confirmar">Apagar</button>
        </div>
    </dialog>


    <footer>
        <p>Carteira de Finanças Pessoais</p>
        <p>
            José Paulo Rodrigues ·
            <a href="https://github.com/josepaulorodrigues111-dotcom/Projeto_JS" target="_blank"
                rel="noopener">GitHub</a>
        </p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>

</html>
